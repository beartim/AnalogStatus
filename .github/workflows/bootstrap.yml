name: Bootstrap and Build AnalogStatus

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos
  IOS_SDK_VERSION: '9.3'

jobs:
  bootstrap-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand complete source tree
        run: |
          set -euxo pipefail
          cat bootstrap/part-* > /tmp/analogstatus-source.b64
          base64 -d /tmp/analogstatus-source.b64 > /tmp/analogstatus-source.tar.gz
          tar -tzf /tmp/analogstatus-source.tar.gz | head -50
          tar -xzf /tmp/analogstatus-source.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit expanded source
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AnalogStatus 1.3-4+opt audited source with GitHub Actions"
          git push origin HEAD:main

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot file dpkg-dev

      - name: Setup Theos and patched SDKs
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          cache: true

      - name: Check build environment
        run: |
          set -euxo pipefail
          test -d "$THEOS"
          test -d "$THEOS/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"
          find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -printf '%f\n' | sort

      - name: Build rootful iOS 9 package
        run: |
          set -o pipefail
          chmod +x build-ios9.sh scripts/verify-package.sh scripts/check-fat-mach-o.py
          ./build-ios9.sh 2>&1 | tee build.log

      - name: Verify DEB
        run: |
          set -euo pipefail
          mapfile -t packages < <(find packages -maxdepth 1 -type f -name '*.deb' | sort)
          test "${#packages[@]}" -eq 1
          ./scripts/verify-package.sh "${packages[0]}" 2>&1 | tee verify.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p artifacts
          find packages -maxdepth 1 -type f -name '*.deb' -exec cp -v {} artifacts/ \; 2>/dev/null || true
          cp -v build.log artifacts/ 2>/dev/null || true
          cp -v verify.log artifacts/ 2>/dev/null || true

      - name: Upload DEB and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnalogStatus-1.3-4-opt-ios9-bootstrap
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
